services:
  nginx:
    build: 
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - recipe_app
    networks:
      - frontend-net

  recipe_app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - frontend-net
      - backend-net

  mongodb:
    image: mongo:6.0.6
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    networks:
      - backend-net

  e2e_tests:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    container_name: test-container-main
    depends_on:
      - nginx
    networks:
      - frontend-net
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  mongodb_data:
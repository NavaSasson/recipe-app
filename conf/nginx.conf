server {
    listen 80;
    server_name localhost;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # Added for better file handling
    }

    # Proxy requests to Flask backend
    location /recipe {
        proxy_pass http://recipe_app:5000;  # Changed from recipe_app to backend (service name in docker-compose)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Added to handle various HTTP methods
        proxy_method $request_method;
        proxy_redirect off;
        
        # Added timeouts
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }
}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Collection</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Recipe Collection</h1>
        
        <div class="category-filter">
            <label for="category">Filter by Category:</label>
            <select id="category" onchange="filterByCategory()">
                <option value="">All Categories</option>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="cakes">Cakes</option>
            </select>
        </div>

        <div class="recipe-grid" id="recipeContainer"></div>

        <div class="form-container">
            <h2>Add New Recipe</h2>
            <form id="recipeForm" onsubmit="submitRecipe(event)">
                <div class="form-group">
                    <label for="name">Recipe Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="recipeCategory" required>
                        <option value="breakfast">Breakfast</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                        <option value="cakes">Cakes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="ingredients">Ingredients (comma-separated):</label>
                    <input type="text" id="ingredients" required>
                </div>
                <div class="form-group">
                    <label for="steps">Steps (comma-separated):</label>
                    <textarea id="steps" required></textarea>
                </div>
                <button type="submit">Add Recipe</button>
            </form>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
